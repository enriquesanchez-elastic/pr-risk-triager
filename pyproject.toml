[project]
name = "pr-risk-triager"
version = "0.1.0"
description = "Triage a pull request: how risky is it, and what should QA test first?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-ai-slim[openai,anthropic]>=2.50",
]

[project.scripts]
triage = "triager.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
