name: Evals

on:
  pull_request:
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      # Pipeline check without the gateway: proves the evals still run and the evaluators still fire.
      - run: uv run python -m evals.run_evals --model stand-in
      # The real gate needs a gateway identity. People use els (Okta); CI can't. Applications call the
      # gateway as an approved GCP service account with a Google ID token (test and prod only), so this
      # step belongs in a pipeline that runs as such an account, e.g. on GKE with Workload Identity.
      # Swap the els token source in src/triager/gateway.py for that ID token, then:
      #   uv run python -m evals.run_evals --repeat 3 --gate 0.8
